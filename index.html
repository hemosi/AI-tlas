<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 导航</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
:root{--bg:#0e1116;--card:#161b22;--line:#262c36;--fg:#e6edf3;--mut:#8b949e;--acc:#7ee787}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg)}
a{color:inherit;text-decoration:none}
.wrap{display:flex;min-height:100vh}
nav{width:170px;flex:none;border-right:1px solid var(--line);padding:18px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:18px;margin:0 8px 14px}
nav a{display:block;padding:7px 10px;border-radius:8px;color:var(--mut)}nav a:hover{background:var(--card);color:var(--fg)}
main{flex:1;padding:18px 28px 60px;max-width:1300px}
.top{display:flex;gap:10px;align-items:center;position:sticky;top:0;background:var(--bg);padding:6px 0 14px;z-index:2}
#q{flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px;outline:none}
#q:focus{border-color:var(--acc)}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
h2{font-size:15px;margin:26px 0 10px;color:var(--mut);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.it{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;position:relative}
.it:hover{border-color:var(--acc);transform:translateY(-1px)}
.ic{width:28px;height:28px;border-radius:7px;flex:none;background:#30363d;display:grid;place-items:center;font-weight:700;overflow:hidden}
.ic img{width:20px;height:20px}
.nm{font-weight:600}.ds{color:var(--mut);font-size:12px;margin-top:2px}
.aff{position:absolute;right:8px;top:8px;font-size:10px;color:var(--acc);border:1px solid var(--acc);border-radius:5px;padding:0 4px}
.x{position:absolute;right:6px;bottom:4px;color:var(--mut);font-size:12px;display:none}.it:hover .x{display:block}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;width:360px}
dialog input{width:100%;margin:5px 0;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.empty{color:var(--mut);padding:30px 0}
@media(max-width:700px){nav{display:none}main{padding:12px}}
</style></head><body>
<div class="wrap"><nav id="side"><h1>🧭 AI 导航</h1></nav>
<main><div class="top"><input id="q" placeholder="搜索名称、用途…（按 / 聚焦，回车打开第一个）" autocomplete="off">
<button id="add">＋ 添加</button><button id="exp" title="把本地新增的链接导出成 links.js">导出</button></div>
<div id="list"></div></main></div>
<dialog id="dlg"><form method="dialog" id="f">
<b>添加链接</b><input name="name" placeholder="名称" required><input name="url" placeholder="https://…" required>
<input name="desc" placeholder="用途（可选）"><input name="cat" placeholder="分类（默认：我的收藏）">
<div style="text-align:right;margin-top:8px"><button value="cancel" formnovalidate>取消</button> <button value="ok">保存</button></div></form></dialog>
<script src="links.js"></script>
<script>
const LS=k=>JSON.parse(localStorage.getItem(k)||"null"), SS=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let local=LS("nav_local")||[], hits=LS("nav_hits")||{};
function all(){const d=JSON.parse(JSON.stringify(window.NAV||[]));
 local.forEach(x=>{let c=d.find(c=>c.cat===x.cat);if(!c){c={cat:x.cat,icon:"⭐",items:[]};d.unshift(c)}c.items.push({...x,_local:1})});return d}
const host=u=>{try{return new URL(u).hostname}catch(e){return""}};
function card(i){const a=document.createElement("a");a.className="it";a.href=i.aff||i.url;a.target="_blank";a.rel="noopener";
 const h=host(i.url);a.innerHTML=`<div class="ic">${(i.name||"?")[0]}</div><div><div class="nm"></div><div class="ds"></div></div>${i.aff?'<span class="aff">推荐</span>':''}${i._local?'<span class="x" title="删除">✕</span>':''}`;
 a.querySelector(".nm").textContent=i.name;a.querySelector(".ds").textContent=i.desc||h;
 const img=new Image();img.onload=()=>{const ic=a.querySelector(".ic");ic.textContent="";ic.appendChild(img)};img.src=`https://icons.duckduckgo.com/ip3/${h}.ico`;
 a.onclick=e=>{if(e.target.classList.contains("x")){e.preventDefault();local=local.filter(x=>x.url!==i.url);SS("nav_local",local);render();return}
  hits[i.url]=(hits[i.url]||0)+1;SS("nav_hits",hits)};return a}
function sec(title,items,id){if(!items.length)return;const L=document.getElementById("list");
 const h=document.createElement("h2");h.id=id||"";h.textContent=title;L.appendChild(h);
 const g=document.createElement("div");g.className="grid";items.forEach(i=>g.appendChild(card(i)));L.appendChild(g)}
let first=null;
function render(){const q=document.getElementById("q").value.trim().toLowerCase(),d=all(),L=document.getElementById("list");L.innerHTML="";first=null;
 const flat=d.flatMap(c=>c.items.map(i=>({...i,cat:c.cat})));
 if(q){const r=flat.filter(i=>[i.name,i.desc,i.url,i.cat,(i.tags||[]).join(" ")].join(" ").toLowerCase().includes(q));
  r.sort((a,b)=>(hits[b.url]||0)-(hits[a.url]||0));first=r[0];sec(`搜索结果（${r.length}）`,r);if(!r.length)L.innerHTML='<div class="empty">没找到，按「＋ 添加」收进来</div>';return}
 const top=flat.filter(i=>hits[i.url]).sort((a,b)=>hits[b.url]-hits[a.url]).slice(0,8);
 const pin=flat.filter(i=>i.pin&&!top.includes(i));
 sec("⚡ 常用",[...top,...flat.filter(i=>i.pin&&!top.some(t=>t.url===i.url))].slice(0,12),"c-top");
 d.forEach((c,n)=>sec(`${c.icon||""} ${c.cat}`,c.items,"c"+n));
 const S=document.getElementById("side");S.querySelectorAll("a").forEach(a=>a.remove());
 [{cat:"常用",icon:"⚡",id:"c-top"},...d.map((c,n)=>({...c,id:"c"+n}))].forEach(c=>{const a=document.createElement("a");a.href="#"+c.id;a.textContent=`${c.icon||""} ${c.cat}`;S.appendChild(a)})}
const q=document.getElementById("q");q.oninput=render;
q.onkeydown=e=>{if(e.key==="Enter"&&first){hits[first.url]=(hits[first.url]||0)+1;SS("nav_hits",hits);open(first.aff||first.url,"_blank")}if(e.key==="Escape"){q.value="";render()}};
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus()}});
const dlg=document.getElementById("dlg");document.getElementById("add").onclick=()=>dlg.showModal();
dlg.onclose=()=>{if(dlg.returnValue!=="ok")return;const f=new FormData(document.getElementById("f"));
 local.push({name:f.get("name"),url:f.get("url"),desc:f.get("desc"),cat:f.get("cat")||"我的收藏"});SS("nav_local",local);document.getElementById("f").reset();render()};
document.getElementById("exp").onclick=()=>{const d=all().map(c=>({...c,items:c.items.map(({_local,...i})=>i)}));
 const b=new Blob(["window.NAV = "+JSON.stringify(d,null,1)+";\n"],{type:"text/javascript"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="links.js";a.click()};
render();
</script></body></html>
